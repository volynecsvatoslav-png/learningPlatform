name: learning-platform

x-api: &api
  build:
    context: ./apps/api
  environment:
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
    PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret-change-before-deployment}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
    DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://localhost:8000,http://127.0.0.1:5173,http://127.0.0.1:8000}
    SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-28800}
    LEARNER_SESSION_AGE: ${LEARNER_SESSION_AGE:-2592000}
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}
    DATABASE_URL: postgresql://${POSTGRES_USER:-learning}:${POSTGRES_PASSWORD:-learning}@postgres:5432/${POSTGRES_DB:-learning}
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
    S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-learning-platform}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minio-local}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minio-local-secret}
    S3_USE_SSL: ${S3_USE_SSL:-false}
    S3_CHECKSUM_POLICY_SUPPORTED: ${S3_CHECKSUM_POLICY_SUPPORTED:-false}
    MEDIA_TRANSFER_MODE: ${MEDIA_TRANSFER_MODE:-proxy}
    PWA_TRANSFER_PEPPER: ${PWA_TRANSFER_PEPPER:-}
    PWA_TRANSFER_TTL_SECONDS: ${PWA_TRANSFER_TTL_SECONDS:-600}
    PWA_TRANSFER_MAX_ATTEMPTS: ${PWA_TRANSFER_MAX_ATTEMPTS:-5}
    PWA_TRANSFER_RATE_LIMIT: ${PWA_TRANSFER_RATE_LIMIT:-12}
    PWA_TRANSFER_RATE_WINDOW_SECONDS: ${PWA_TRANSFER_RATE_WINDOW_SECONDS:-300}
    OFFLINE_LICENSE_SIGNING_PRIVATE_KEY_B64: ${OFFLINE_LICENSE_SIGNING_PRIVATE_KEY_B64:-}
    VITE_OFFLINE_LICENSE_PUBLIC_JWK: '${VITE_OFFLINE_LICENSE_PUBLIC_JWK:-{"kty":"EC","x":"l242GNMQAQSa-GSVtUflOeS6m1kzEOi9oRA88cUx5v8","y":"Rw_iSGOS8Djf5dm5zVJoBwIskMOikApH8pPOp6vh0eo","crv":"P-256"}}'
    OFFLINE_LICENSE_TTL_HOURS: ${OFFLINE_LICENSE_TTL_HOURS:-168}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learning}
      POSTGRES_USER: ${POSTGRES_USER:-learning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learning}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minio-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minio-local-secret}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-local-kms-key:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MEDIA_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minio-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minio-local-secret}
      S3_BUCKET: ${S3_BUCKET:-learning-platform}
      MEDIA_CORS_ALLOWED_ORIGINS: ${MEDIA_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *api
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *api
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-secret-change-before-deployment}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-learning}:${POSTGRES_PASSWORD:-learning}@postgres:5432/${POSTGRES_DB:-learning}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-learning-platform}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minio-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minio-local-secret}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_CHECKSUM_POLICY_SUPPORTED: ${S3_CHECKSUM_POLICY_SUPPORTED:-false}
      MEDIA_TRANSFER_MODE: ${MEDIA_TRANSFER_MODE:-proxy}
      PWA_TRANSFER_PEPPER: ${PWA_TRANSFER_PEPPER:-}
      OFFLINE_LICENSE_SIGNING_PRIVATE_KEY_B64: ${OFFLINE_LICENSE_SIGNING_PRIVATE_KEY_B64:-}
      VITE_OFFLINE_LICENSE_PUBLIC_JWK: '${VITE_OFFLINE_LICENSE_PUBLIC_JWK:-{"kty":"EC","x":"l242GNMQAQSa-GSVtUflOeS6m1kzEOi9oRA88cUx5v8","y":"Rw_iSGOS8Djf5dm5zVJoBwIskMOikApH8pPOp6vh0eo","crv":"P-256"}}'
      OFFLINE_LICENSE_TTL_HOURS: ${OFFLINE_LICENSE_TTL_HOURS:-168}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      SKIP_MIGRATIONS: "true"
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 3 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./apps/web
    environment:
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      VITE_ENABLE_SERVICE_WORKER: ${VITE_ENABLE_SERVICE_WORKER:-true}
      VITE_OFFLINE_LICENSE_PUBLIC_JWK: '${VITE_OFFLINE_LICENSE_PUBLIC_JWK:-{"kty":"EC","x":"l242GNMQAQSa-GSVtUflOeS6m1kzEOi9oRA88cUx5v8","y":"Rw_iSGOS8Djf5dm5zVJoBwIskMOikApH8pPOp6vh0eo","crv":"P-256"}}'
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
