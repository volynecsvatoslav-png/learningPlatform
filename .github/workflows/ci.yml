name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: learning
          POSTGRES_USER: learning
          POSTGRES_PASSWORD: learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning -d learning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://learning:learning@localhost:5432/learning
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-secret-key-with-sufficient-length
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install --requirement requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy accounts vendors learning media_assets learner vendor_api config
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the stack
        run: docker compose up --build --detach --wait
        timeout-minutes: 20
      - name: Bootstrap E2E owner
        run: |
          docker compose exec -T \
            -e E2E_BOOTSTRAP_ENABLED=true \
            -e E2E_OWNER_EMAIL=owner.e2e@example.com \
            -e E2E_OWNER_PASSWORD="unusual e2e password 48371" \
            -e E2E_VENDOR_NAME="E2E Vendor" \
            -e E2E_VENDOR_SLUG=e2e-vendor \
            api python manage.py bootstrap_e2e_owner
      - name: Bootstrap E2E vendor B
        run: |
          docker compose exec -T \
            -e E2E_BOOTSTRAP_ENABLED=true \
            -e E2E_VENDOR_B_NAME="E2E Vendor B" \
            -e E2E_VENDOR_B_SLUG=e2e-vendor-b \
            -e E2E_VENDOR_B_OWNER_EMAIL=owner.b@example.com \
            -e E2E_VENDOR_B_OWNER_PASSWORD="unusual e2e vendor b password 73918" \
            -e E2E_VENDOR_B_COURSE_TITLE="E2E Course B" \
            -e E2E_VENDOR_B_COURSE_SLUG=e2e-course-b \
            api python manage.py bootstrap_e2e_vendor
      - name: Vendor and learner E2E
        run: npm run test:e2e
        env:
          E2E_OWNER_EMAIL: owner.e2e@example.com
          E2E_OWNER_PASSWORD: "unusual e2e password 48371"
          E2E_VENDOR_NAME: E2E Vendor
          E2E_VENDOR_B_OWNER_EMAIL: owner.b@example.com
          E2E_VENDOR_B_OWNER_PASSWORD: "unusual e2e vendor b password 73918"
          E2E_VENDOR_B_NAME: E2E Vendor B
          E2E_VENDOR_B_COURSE_TITLE: E2E Course B
          E2E_LEARNER_EMAIL: learner.global@example.com
          E2E_BASE_URL: http://localhost:5173
          E2E_MAILPIT_URL: http://localhost:8025
      - name: Offline PWA E2E
        run: npm run test:e2e:pwa
