[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-platform-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi==25.1.0",
    "boto3==1.43.69",
    "celery==5.5.3",
    "cryptography==45.0.6",
    "Django==5.2.17",
    "djangorestframework==3.18.0",
    "filetype==1.2.0",
    "gunicorn==23.0.0",
    "psycopg[binary]==3.2.10",
    "PyJWT==2.10.1",
    "redis==6.4.0",
    "whitenoise==6.9.0",
]

[project.optional-dependencies]
dev = [
    "django-stubs==5.2.9",
    "djangorestframework-stubs==3.16.9",
    "factory-boy==3.3.3",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-django==4.11.1",
    "ruff==0.12.8",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["accounts/tests", "vendors/tests", "learning/tests", "media_assets/tests", "learner/tests", "vendor_api/tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "RUF"]
ignore = ["DJ001", "DJ008", "RUF012"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
exclude = ["migrations|tests"]

[tool.django-stubs]
django_settings_module = "config.settings"
strict_settings = true
strict_model_abstract_attrs = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.config", "celery", "filetype"]
ignore_missing_imports = true
